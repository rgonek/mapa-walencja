<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa — Walencja i okolice (wakacje 2026)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e8eef6;
      --muted: #9aadc2;
      --accent: #3d9cf0;
      --border: #2a3a4f;
      --fb: #8b9cf7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      height: 100%;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { max-height: 45vh; }
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .aside-head {
      padding: 1rem 1rem 0.5rem;
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.15rem;
      margin: 0 0 0.25rem;
      font-weight: 650;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.82rem;
      margin: 0 0 0.75rem;
      line-height: 1.4;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }
    .filters button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.25rem 0.65rem;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .filters button.active,
    .filters button:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(61, 156, 240, 0.12);
    }
    .list-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 1rem 1rem;
      scroll-behavior: smooth;
    }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .list li:hover {
      border-color: var(--accent);
      background: rgba(61, 156, 240, 0.08);
    }
    .list li.focus {
      border-color: var(--accent);
      background: rgba(61, 156, 240, 0.14);
      box-shadow: 0 0 0 2px rgba(61, 156, 240, 0.25);
    }
    .list .name { font-weight: 600; font-size: 0.92rem; }
    .list .meta {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 0.25rem;
      line-height: 1.4;
    }
    .list .quote {
      color: #b8c8d8;
      font-size: 0.74rem;
      margin-top: 0.35rem;
      line-height: 1.35;
      font-style: italic;
      border-left: 2px solid var(--border);
      padding-left: 0.5rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.66rem;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      margin-right: 0.2rem;
      margin-bottom: 0.2rem;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.baza { color: #f0c14d; border-color: #6a5520; }
    .badge.dzieci { color: #7ddea0; border-color: #2d5a40; }
    .badge.jedzenie { color: #f0a07a; border-color: #6a3a28; }
    .badge.miasto { color: #9bb8ff; border-color: #2e4470; }
    .badge.plaża { color: #7ec8e8; border-color: #2a5568; }
    .badge.wycieczka { color: #d4a8ff; border-color: #4a3568; }
    .badge.fb { color: var(--fb); border-color: #3d4570; }
    .mentions {
      font-size: 0.7rem;
      color: var(--fb);
      margin-left: 0.25rem;
    }
    #map { width: 100%; height: 100%; min-height: 320px; }
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      max-width: 320px;
    }
    .leaflet-popup-content { margin: 0.7rem 0.85rem; }
    .popup-title { font-weight: 700; margin-bottom: 0.3rem; font-size: 0.95rem; }
    .popup-body { font-size: 0.85rem; color: #334; line-height: 1.4; }
    .popup-drive { font-size: 0.78rem; color: #556; margin-top: 0.35rem; }
    .popup-quote {
      font-size: 0.78rem;
      color: #445;
      margin-top: 0.4rem;
      font-style: italic;
      border-left: 2px solid #ccd;
      padding-left: 0.45rem;
      line-height: 1.35;
    }
    .popup-link { font-size: 0.75rem; margin-top: 0.35rem; }
    .legend-note {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.5rem 1rem 0.85rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      line-height: 1.35;
    }
    a { color: var(--accent); }
    code { font-size: 0.78em; }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="aside-head">
        <h1>Walencja i okolice</h1>
        <p class="subtitle">
          Plan 2+1 + miejsca z <strong>8 subagentów</strong> czytających posty FB
          (grupa walencja.es). Klik marker = dymek + scroll listy.
        </p>
        <div class="filters" id="filters">
          <button type="button" data-filter="all" class="active">Wszystkie</button>
          <button type="button" data-filter="baza">Baza</button>
          <button type="button" data-filter="dzieci">Z dzieckiem</button>
          <button type="button" data-filter="miasto">Miasto</button>
          <button type="button" data-filter="plaża">Plaża</button>
          <button type="button" data-filter="jedzenie">Jedzenie</button>
          <button type="button" data-filter="wycieczka">Wycieczka</button>
          <button type="button" data-filter="fb">Z FB</button>
        </div>
      </div>
      <div class="list-wrap" id="listWrap">
        <ul class="list" id="list"></ul>
      </div>
      <p class="legend-note">
        ⏱ Czasy z <strong>Daimus</strong>.
        Źródło: <code>agent_places_merged.md</code>
        · mapa: <code>mapa-walencja.html</code>
      </p>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const places = [{"id": "barrio-del-carmen", "name": "Barrio del Carmen", "lat": 39.4788, "lng": -0.3795, "tags": ["baza", "miasto", "fb"], "drive": "55–70 min", "desc": "FB: serce starego miasta — super na krótki city break. Na tydzień z 4-latkiem: ostrożnie (głośno wieczorem, imprezy). recommendations.jsonl: Σ48 (posty 18 + komentarze 30), +42/−10.", "source": "fb-agents", "mentions": 48, "quote": "El Carmen – serce street artu… największe muzeum sztuki ulicznej na świeżym powietrzu", "url": "https://www.facebook.com/groups/walencja.es/posts/2738321863167801/"}, {"id": "cabanyal", "name": "Cabanyal", "lat": 39.4685, "lng": -0.3295, "tags": ["baza", "plaża", "miasto", "fb"], "drive": "60–75 min", "desc": "FB mocno: „super lokalizacja” (plaża + port, mozaiki, knajpy localsów). Przewodnik: dobra baza z dziećmi. Uwaga: bywają pytania o bezpieczeństwo latem. recommendations.jsonl: Σ47 (posty 14 + komentarze 33), +29/−9.", "source": "fb-agents", "mentions": 47, "quote": "Mieszkaliśmy w dzielnicy Cabanyal na ulicy de La Reina i uważam, że to była super lokalizacja", "url": "https://www.facebook.com/groups/walencja.es/posts/2226101451056514/"}, {"id": "puerto-de-sagunto", "name": "Puerto de Sagunto", "lat": 39.655, "lng": -0.215, "tags": ["baza", "plaża", "wycieczka", "fb"], "drive": "~50 min", "desc": "FB: plaża + baza na północ od Walencji (obok historycznego Sagunto). recommendations.jsonl: Σ37 (posty 12 + komentarze 25), +19/−10.", "source": "fb-agents", "mentions": 37, "quote": "transport... z lotniska Castellon do miejscowości Puerto de Sagunto", "url": "https://www.facebook.com/groups/walencja.es/posts/2257848104548515/"}, {"id": "ruzafa-russafa", "name": "Ruzafa / Russafa", "lat": 39.4615, "lng": -0.3735, "tags": ["baza", "miasto", "jedzenie", "fb"], "drive": "55–70 min", "desc": "FB top na nocleg w mieście: kawiarnie, knajpy, lokalne życie. Minus: hałas, drożej, daleko do plaży pieszo. recommendations.jsonl: Σ23 (posty 8 + komentarze 15), +16/−6.", "source": "fb-agents", "mentions": 35, "quote": "Dzielnice Eixample, Mont Olivete, Russafa", "url": "https://www.facebook.com/groups/walencja.es/posts/2246982635635062/"}, {"id": "cullera", "name": "Cullera", "lat": 39.1648, "lng": -0.2495, "tags": ["baza", "plaża", "wycieczka", "fb"], "drive": "30–35 min", "desc": "FB: „perełka”, plaża, oddech od zgiełku — sensowna baza poza miastem bliżej Walencji niż Daimus. Hotel Santa Marta: jedna pozytywna opinia rodzinna. recommendations.jsonl: Σ34 (posty 7 + komentarze 27), +12/−5.", "source": "fb-agents", "mentions": 34, "quote": "Cullera to perełka i miły oddech od zgiełku też uroczej Walencji. Piękna plaża, czysta woda", "url": "https://www.facebook.com/groups/walencja.es/posts/2331096403890351/"}, {"id": "pla-a-rac-cullera", "name": "Plaża Racó (Cullera)", "lat": 39.1758, "lng": -0.2415, "tags": ["baza", "plaża", "dzieci"], "drive": "30–35 min", "desc": "FB: „perełka”, plaża, oddech od zgiełku — sensowna baza poza miastem bliżej Walencji niż Daimus. Hotel Santa Marta: jedna pozytywna opinia rodzinna. recommendations.jsonl: Σ34 (posty 7 + komentarze 27), +12/−5.", "source": "plan", "mentions": 34, "quote": "Cześć szukam transportu w czwartek 2.07 z Cullera na lotnisko do Walencji dla rodzicow (2 osoby) Musz sie dostać na lotnisko do 8:30 rano Prośba o n…", "url": null}, {"id": "malvarrosa", "name": "Malvarrosa", "lat": 39.4765, "lng": -0.3245, "tags": ["baza", "plaża", "miasto", "fb"], "drive": "60–75 min", "desc": "FB: główna plaża miejska; okolica knajp/promenady. Porównywana z Cabanyal jako lokalizacja noclegu przy morzu. recommendations.jsonl: Σ32 (posty 14 + komentarze 18), +24/−3.", "source": "fb-agents", "mentions": 32, "quote": "Czytałam też o plaży Malvarossa. Jeśli ktoś ma porównanie o noclegach przy tych plażach (i o samych plażach)", "url": "https://www.facebook.com/groups/walencja.es/posts/2544927115840611/"}, {"id": "gand-a", "name": "Gandía", "lat": 38.9955, "lng": -0.1615, "tags": ["baza", "plaża", "wycieczka", "fb"], "drive": "5–10 min", "desc": "Gandía jako baza plażowa / dojazd pociągiem lub autem do Walencji. Dużo apartamentów przy plaży. recommendations.jsonl: Σ16 (posty 4 + komentarze 12), +8/−5.", "source": "fb-agents", "mentions": 23, "quote": "wybieram się do Gandii... z Walencji do Gandii... stację PKP i przystanek Platja de Gandia", "url": "https://www.facebook.com/groups/walencja.es/posts/2248133745519951/"}, {"id": "patacona", "name": "Patacona", "lat": 39.4885, "lng": -0.3235, "tags": ["baza", "plaża", "fb"], "drive": "60–75 min", "desc": "FB: częsty nocleg przy plaży miejskiej (północ). Kompromis plaża + dojazd do centrum. Hotel Resa Patacona — pytania o opinie, nie twarda rec. recommendations.jsonl: Σ22 (posty 8 + komentarze 14), +16/−4.", "source": "fb-agents", "mentions": 22, "quote": "Malvarrosa i Patacona rozwijają się turystycznie, ale nadal są ciche poza sezonem letnim", "url": "https://www.facebook.com/groups/walencja.es/posts/2846423585690961/"}, {"id": "port-saplaya", "name": "Port Saplaya", "lat": 39.5085, "lng": -0.3245, "tags": ["baza", "wycieczka", "plaża", "fb"], "drive": "~50 min", "desc": "FB: „mała Wenecja” — pastelowe domki, kanały. Raczej klimatyczny wypad/baza krótka niż tydzień z basenem. recommendations.jsonl: Σ21 (posty 2 + komentarze 19), +14/−5.", "source": "fb-agents", "mentions": 21, "quote": "Port Saplaya nazywana jest „małą Wenecją Walencji” – pastelowe domki z balkonami odbijają się w spokojnych kanałach", "url": "https://www.facebook.com/groups/walencja.es/posts/2765129917153662/"}, {"id": "playa-de-gand-a", "name": "Playa de Gandía", "lat": 38.9955, "lng": -0.1615, "tags": ["baza", "plaża"], "drive": "5–10 min", "desc": "Baza plażowa blisko Daimusa: promenada, sklepy, lody. Często w planach Walencja+Gandía (FB + X). recommendations.jsonl: Σ16 (posty 4 + komentarze 12), +8/−5.", "source": "plan", "mentions": 16, "quote": "Zapraszamy do Apartamento Layla Gandia, jesteśmy na bookingu, ale proszę pisać priv w razie pytań. Z Walencji dojazd bezpośrednio pociągie…", "url": null}, {"id": "marina-de-valencia", "name": "Marina de Valencia", "lat": 39.4625, "lng": -0.3205, "tags": ["baza", "miasto", "plaża", "fb"], "drive": "60–75 min", "desc": "Nowoczesna marina — okolica noclegów „przy porcie”; blisko Cabanyal/Malvarrosa.", "source": "fb-agents", "mentions": 10, "quote": "Spacer po porcie i marinie – nowoczesna dzielnica nadmorska, gdzie odbywało się America’s Cup", "url": "https://www.facebook.com/groups/walencja.es/posts/2717570568576264/"}, {"id": "oropesa-del-mar", "name": "Oropesa del Mar", "lat": 40.0925, "lng": 0.1345, "tags": ["baza", "plaża", "wycieczka", "fb"], "drive": "~1–1,25 h", "desc": "FB: baza/transfery na północ (Castellón). Raczej dłuższy dojazd z lotniska VLC. recommendations.jsonl: Σ10 (posty 4 + komentarze 6), +2/−0.", "source": "fb-agents", "mentions": 10, "quote": "transfer z Walencja - Oropesa del mar", "url": "https://www.facebook.com/groups/walencja.es/posts/2290447887955203/"}, {"id": "el-saler", "name": "El Saler", "lat": 39.383, "lng": -0.318, "tags": ["baza", "plaża", "wycieczka", "fb"], "drive": "45–55 min", "desc": "FB: chwalona plaża (wraz z Malvarrosa/Patacona). Baza bliżej miasta + Albufera; mniej typowych apartamentów wakacyjnych niż Safor. recommendations.jsonl: Σ7 (posty 3 + komentarze 4), +5/−0.", "source": "fb-agents", "mentions": 9, "quote": "Najlepsze: Malvarrosa, Patacona, Saler", "url": "https://www.facebook.com/groups/walencja.es/posts/2791266687873318/"}, {"id": "ensanche-eixample", "name": "Ensanche / L’Eixample", "lat": 39.4675, "lng": -0.3705, "tags": ["baza", "miasto", "fb"], "drive": "55–70 min", "desc": "FB: „elegancko i centralnie” — na liście najlepszych dzielnic na nocleg (Ruzafa, Ensanche, El Carmen, Cabanyal). Spokojniej niż Carmen. recommendations.jsonl: Σ7 (posty 5 + komentarze 2), +5/−2.", "source": "fb-agents", "mentions": 7, "quote": "Najlepsze dzielnice: Ruzafa, Ensanche, El Carmen, Cabanyal.", "url": "https://www.facebook.com/groups/wa  wzmianek, sentyment=recommend. Na liście planowanych jednodniowych wypadów autem z Walencji (wraz z Xàtiva, Chulilla, Sagunto)", "source": "fb-agents", "mentions": 1, "quote": "Na liście są już Zamek w Xátiva, Pena cortada Chelva, Chulilla Wiszące mosty i Sagunto. Co jeszcze?", "url": "https://www.facebook.com/groups/walencja.es/posts/2878115035855149/"}, {"id": "guadalest", "name": "Guadalest", "lat": 38.6765, "lng": -0.1985, "tags": ["wycieczka", "fb"], "drive": "~1,75 h", "desc": "Agenci (czytanie postów FB): 1 wzmianek, sentyment=recommend. Duża liczba muzeów na małej przestrzeni – wyjątkowa atrakcja turystyczna", "source": "fb-agents", "mentions": 1, "quote": "Guadalest to jedno z nielicznych miejsc, które wyróżnia się tak dużą liczbą muzeów na bardzo małej przestrzeni", "url": "https://www.facebook.com/groups/walencja.es/posts/2943125239354128/"}, {"id": "lonja-de-la-seda", "name": "Lonja de la Seda", "lat": 39.4744, "lng": -0.3784, "tags": ["miasto", "fb"], "drive": "55–70 min", "desc": "Agenci (czytanie postów FB): 1 wzmianek, sentyment=recommend. Zabytek UNESCO; dawne centrum handlu jedwabiem XV–XVI w.", "source": "fb-agents", "mentions": 1, "quote": "Lonja de la Seda – Dziś to jeden z najpiękniejszych zabytków miasta i obiekt wpisany na listę UNESCO.", "url": "https://www.facebook.com/groups/walencja.es/posts/3019348845065100/"}, {"id": "requena", "name": "Requena", "lat": 39.4885, "lng": -1.1005, "tags": ["wycieczka", "fb"], "drive": "~1 h", "desc": "Agenci (czytanie postów FB): 1 wzmianek, sentyment=recommend. Stare miasto, podziemne piwnice, lokalna kuchnia, bez masowej turystyki", "source": "fb-agents", "mentions": 1, "quote": "Requena – podziemne piwnice i klimat historii — stare miasto + winiarska tradycja", "url": "https://www.facebook.com/groups/walencja.es/posts/2916009312065721/"}, {"id": "viveros-jardines-del-real", "name": "Viveros / Jardines del Real", "lat": 39.4795, "lng": -0.3655, "tags": ["miasto", "dzieci", "fb"], "drive": "55–70 min", "desc": "Agenci (czytanie postów FB): 1 wzmianek, sentyment=recommend. Park z alejkami pachnącymi pomarańczami (azahar)", "source": "fb-agents", "mentions": 1, "quote": "Jardines del Real (Viveros) – elegancki park z alejkami pachnącymi kwiatami pomarańczy", "url": "https://www.facebook.com/groups/walencja.es/posts/2770395883293732/"}];

    const tagColors = {
      baza: "#f0c14d",
      dzieci: "#7ddea0",
      miasto: "#9bb8ff",
      plaża: "#7ec8e8",
      jedzenie: "#f0a07a",
      wycieczka: "#d4a8ff",
      fb: "#8b9cf7"
    };

    const map = L.map("map").setView([39.15, -0.28], 9);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const markers = {};
    const listItems = {};
    let activeFilter = "all";
    let focusId = null;

    function primaryTag(tags) {
      const order = ["baza", "dzieci", "jedzenie", "plaża", "miasto", "wycieczka", "fb"];
      return order.find((t) => tags.includes(t)) || tags[0];
    }

    function markerIcon(tags, focused) {
      const color = tagColors[primaryTag(tags)] || "#3d9cf0";
      const size = focused ? 20 : 16;
      return L.divIcon({
        className: "",
        html: `<div style="
          width:${size}px;height:${size}px;border-radius:50%;
          background:${color};border:2px solid #fff;
          box-shadow:0 1px 4px rgba(0,0,0,.45);
        "></div>`,
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
        popupAnchor: [0, -size / 2]
      });
    }

    function popupHtml(p) {
      let html = `<div class="popup-title">${escapeHtml(p.name)}</div>`;
      html += `<div class="popup-body">${escapeHtml(p.desc)}</div>`;
      html += `<div class="popup-drive">⏱ Z Daimus: ${escapeHtml(p.drive)}`;
      if (p.mentions) html += ` · FB: ${p.mentions} wzmianek`;
      html += `</div>`;
      if (p.quote) {
        html += `<div class="popup-quote">${escapeHtml(truncate(p.quote, 220))}</div>`;
      }
      if (p.url) {
        html += `<div class="popup-link"><a href="${escapeAttr(p.url)}" target="_blank" rel="noopener">Post na FB</a></div>`;
      }
      return html;
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, "&#39;");
    }
    function truncate(s, n) {
      s = String(s || "");
      return s.length > n ? s.slice(0, n - 1) + "…" : s;
    }

    function focusPlace(id, fromMap) {
      focusId = id;
      const p = places.find((x) => x.id === id);
      if (!p) return;

      places.forEach((pl) => {
        if (markers[pl.id]) {
          markers[pl.id].setIcon(markerIcon(pl.tags, pl.id === id));
        }
      });

      if (markers[id]) {
        if (fromMap) {
          markers[id].openPopup();
        } else {
          map.setView([p.lat, p.lng], Math.max(map.getZoom(), 12), { animate: true });
          markers[id].openPopup();
        }
      }

      renderList();
      requestAnimationFrame(() => {
        const el = listItems[id];
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      });
    }

    places.forEach((p) => {
      const m = L.marker([p.lat, p.lng], { icon: markerIcon(p.tags, false) })
        .bindPopup(popupHtml(p), { maxWidth: 320, autoPan: true });
      m.on("click", () => focusPlace(p.id, true));
      markers[p.id] = m;
      m.addTo(map);
    });

    const daimus = places.find((p) => p.id === "daimus");
    const ocean = places.find((p) => (p.id || "").includes("oceanog"));
    if (daimus && ocean) {
      L.polyline(
        [[daimus.lat, daimus.lng], [ocean.lat, ocean.lng]],
        { color: "#3d9cf0", weight: 2, opacity: 0.4, dashArray: "6 8" }
      ).addTo(map);
    }

    function matchesFilter(p) {
      if (activeFilter === "all") return true;
      if (activeFilter === "fb") return p.source !== "plan" || p.mentions > 0 || (p.tags || []).includes("fb");
      return (p.tags || []).includes(activeFilter);
    }

    function renderList() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      Object.keys(listItems).forEach((k) => delete listItems[k]);

      places.filter(matchesFilter).forEach((p) => {
        const li = document.createElement("li");
        li.dataset.id = p.id;
        if (p.id === focusId) li.classList.add("focus");
        const tags = [...(p.tags || [])];
        if (p.mentions > 0 && !tags.includes("fb")) tags.push("fb");
        const badges = tags
          .map((t) => `<span class="badge ${t}">${t}</span>`)
          .join("");
        const mBadge = p.mentions
          ? `<span class="mentions">×${p.mentions}</span>`
          : "";
        let html = `<div>${badges}</div>`;
        html += `<div class="name">${escapeHtml(p.name)}${mBadge}</div>`;
        html += `<div class="meta">${escapeHtml(p.drive)} · ${escapeHtml(p.desc)}</div>`;
        if (p.quote) {
          html += `<div class="quote">${escapeHtml(truncate(p.quote, 160))}</div>`;
        }
        li.innerHTML = html;
        li.addEventListener("click", () => focusPlace(p.id, false));
        list.appendChild(li);
        listItems[p.id] = li;
      });

      places.forEach((p) => {
        const m = markers[p.id];
        if (!m) return;
        if (matchesFilter(p)) {
          if (!map.hasLayer(m)) m.addTo(map);
        } else {
          if (map.hasLayer(m)) map.removeLayer(m);
        }
      });
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      document.querySelectorAll("#filters button").forEach((b) => {
        b.classList.toggle("active", b === btn);
      });
      renderList();
    });

    renderList();
    const bounds = L.latLngBounds(places.map((p) => [p.lat, p.lng]));
    map.fitBounds(bounds.pad(0.08));
  </script>
</body>
</html>
